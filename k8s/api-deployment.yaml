apiVersion: apps/v1
kind: Deployment
metadata:
  name: powershell-api
  namespace: powershell-learning
  labels:
    app: powershell-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: powershell-api
  template:
    metadata:
      labels:
        app: powershell-api
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: api
        image: your-registry/powershell-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: EXECUTOR_ADDR
          value: "http://powershell-executor:50051"
        - name: API_ADDR
          value: "0.0.0.0:3000"
        - name: RUST_LOG
          value: "info,apps_api=debug,axum=info,tower_http=info"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: powershell-api
  namespace: powershell-learning
  labels:
    app: powershell-api
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: powershell-api