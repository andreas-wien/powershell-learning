apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: powershell-api
  namespace: powershell-learning
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.powershell-learning.example.com
    secretName: powershell-api-tls
  rules:
  - host: api.powershell-learning.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: powershell-api
            port:
              number: 3000