apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: powershell-learning

resources:
- namespace.yaml
- executor-deployment.yaml
- api-deployment.yaml
- ingress.yaml

commonLabels:
  project: powershell-learning
  managed-by: kustomize

images:
- name: your-registry/powershell-executor
  newTag: latest
- name: your-registry/powershell-api
  newTag: latest