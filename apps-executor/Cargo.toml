[package]
name = "apps-executor"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = { version = "0.12", features = ["tls", "transport"] }
prost = { version = "0.13", features = ["derive"] }
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

# Generated from proto/executor.proto (manually created in proto-gen)
executor = { path = "../proto-gen" }