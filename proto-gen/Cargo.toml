[package]
name = "executor"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = { version = "0.13", features = ["derive"] }
prost-types = "0.13"
tonic = { version = "0.12", features = ["tls", "transport"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12"