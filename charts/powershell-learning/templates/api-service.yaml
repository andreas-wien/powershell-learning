{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "powershell-learning.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "powershell-learning.labels" . | nindent 4 }}
    component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
  - port: {{ .Values.api.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "powershell-learning.selectorLabels" . | nindent 4 }}
    component: api
{{- end }}